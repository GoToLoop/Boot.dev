[project]
name = "Asteroids"
version = "0.1.0"
description = "Boot.dev: Asteroid"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "pygame==2.6.1",
]

[tool.pyright]
typeCheckingMode = "recommended"
reportUnusedCallResult = "hint"
reportUnusedExpression = "hint"
reportDeprecated = "hint"
reportUnannotatedClassAttribute = "hint"
